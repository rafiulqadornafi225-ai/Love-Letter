<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Love Letter For Sadia 💖</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;500;600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        .font-sacramento { font-family: 'Sacramento', cursive; }
        .font-dancing { font-family: 'Dancing Script', cursive; }
        .font-poppins { font-family: 'Poppins', sans-serif; }
        
        body {
            perspective: 1500px;
            overflow-x: hidden;
        }

        /* --- Pure CSS Cute Cartoon Character with Arms & Legs --- */
        #cssCartoon {
            width: 70px;
            height: 110px;
            position: absolute;
            top: -120px;
            left: -140px; /* Start Top-Left */
            z-index: 50;
            opacity: 0;
        }

        .cartoon-hair {
            width: 48px;
            height: 22px;
            background: #2c1e12;
            border-radius: 25px 25px 0 0;
            position: absolute;
            top: -6px;
            left: 11px;
            z-index: 2;
        }

        .cartoon-head {
            width: 44px;
            height: 48px;
            background: #ffdbac;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 13px;
            box-shadow: inset -3px -3px 0px rgba(0,0,0,0.1);
        }

        .cartoon-eye {
            width: 6px;
            height: 6px;
            background: #222;
            border-radius: 50%;
            position: absolute;
            top: 18px;
        }
        .cartoon-eye.left { left: 10px; }
        .cartoon-eye.right { right: 10px; }

        .cartoon-mouth {
            width: 10px;
            height: 5px;
            border: 2px solid #e63946;
            border-top: none;
            border-radius: 0 0 10px 10px;
            position: absolute;
            bottom: 10px;
            left: 17px;
        }

        .cartoon-body {
            width: 36px;
            height: 45px;
            background: #ff5964;
            border-radius: 18px 18px 0 0;
            position: absolute;
            top: 47px;
            left: 17px;
        }

        /* Animated Arms */
        .cartoon-arm {
            width: 10px;
            height: 38px;
            background: #ffdbac;
            border-radius: 5px;
            position: absolute;
            top: 2px;
            transform-origin: top center;
        }
        .cartoon-arm.left { left: -9px; }
        .cartoon-arm.right { 
            right: -9px; 
            transition: transform 0.5s ease;
        }

        /* Pulling Action for Right Arm */
        .pulling-arm {
            transform: rotate(-70deg) translateY(-10px);
        }

        /* Animated Legs */
        .cartoon-leg {
            width: 9px;
            height: 35px;
            background: #3a86ff;
            position: absolute;
            bottom: -32px;
            border-radius: 0 0 5px 5px;
            transform-origin: top center;
        }
        .cartoon-leg.left { left: 8px; }
        .cartoon-leg.right { right: 8px; }

        @keyframes legMoveLeft {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(25deg); }
        }
        @keyframes legMoveRight {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-25deg); }
        }
        .cartoon-leg.left { animation: legMoveLeft 0.3s infinite ease-in-out; }
        .cartoon-leg.right { animation: legMoveRight 0.3s infinite ease-in-out; }

        /* --- Movement Keyframes --- */
        @keyframes walkFromTopLeft {
            0% { top: -120px; left: -140px; opacity: 0; }
            30% { opacity: 1; }
            100% { top: 35px; left: calc(50% - 90px); opacity: 1; }
        }

        @keyframes walkToRight {
            0% { top: 35px; left: calc(50% - 90px); opacity: 1; transform: scale(1); }
            100% { top: 35px; left: calc(100% + 120px); opacity: 0; transform: scale(0.9); }
        }

        /* --- Envelope Curtain Design --- */
        #envelopeCurtain {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #9b2226, #ae2012);
            border-radius: 1rem;
            z-index: 35;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.5s ease;
            transform-origin: top;
        }
        .curtain-pulled {
            transform: translateY(-130%) rotate(-8deg);
            opacity: 0;
        }

        @keyframes envelopeFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-8px) rotate(1deg) scale(1.01); }
        }

        @keyframes popUpLetter {
            0% { transform: scale(0.75); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes magicalGlow {
            0%, 100% { filter: drop-shadow(0 0 25px rgba(255, 105, 180, 0.7)) drop-shadow(0 0 50px rgba(255, 20, 147, 0.5)); }
            50% { filter: drop-shadow(0 0 45px rgba(255, 105, 180, 0.95)) drop-shadow(0 0 80px rgba(255, 20, 147, 0.75)); }
        }

        .animate-float { animation: envelopeFloat 4s ease-in-out infinite; }
        .letter-appear { animation: popUpLetter 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .glowing-bg { animation: magicalGlow 3s infinite ease-in-out; }

        /* Heart Rain Canvas */
        #heartCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

        /* Scrollable Letter Content Area */
        #letterContent { overflow-y: auto; flex-grow: 1; padding: 14px 18px; margin-top: 10px; margin-bottom: 10px; scroll-behavior: smooth; }
        #letterContent::-webkit-scrollbar { width: 5px; }
        #letterContent::-webkit-scrollbar-track { background: rgba(255, 182, 193, 0.2); border-radius: 10px; }
        #letterContent::-webkit-scrollbar-thumb { background: rgba(225, 29, 72, 0.7); border-radius: 10px; }
    
/* CLEAN ROMANTIC REEL MODE */

#letterPaper {
    transform-origin: center bottom;
    backdrop-filter: blur(2px);
}

#letterContent p {
    opacity: 0;
    transform: translateY(25px);
    animation: textReveal 0.8s forwards;
}

#line1 { animation-delay: .5s !important; }
#line2 { animation-delay: 1.8s !important; }
#line3 { animation-delay: 3.8s !important; }
#line4 { animation-delay: 5.8s !important; }

@keyframes textReveal {
    to {
        opacity:1;
        transform:translateY(0);
    }
}

#letterPaper::before {
    content:"";
    position:absolute;
    inset:10px;
    border-radius:20px;
    background:linear-gradient(120deg, transparent, rgba(255,105,180,.25), transparent);
    animation:paperShine 4s infinite;
    pointer-events:none;
}

@keyframes paperShine {
    0% { transform:translateX(-100%); }
    50%,100% { transform:translateX(100%); }
}

.envelope-open-effect {
    animation: envelopeRise 1.2s cubic-bezier(.2,1.4,.4,1);
}

@keyframes envelopeRise {
    from {
        transform:translateY(100px) scale(.7) rotateX(40deg);
        opacity:0;
    }
    to {
        transform:translateY(0) scale(1) rotateX(0);
        opacity:1;
    }
}

.floating-letter {
    animation: floatingLetter 5s ease-in-out infinite;
}

@keyframes floatingLetter {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-8px); }
}

#cssCartoon {
    filter:drop-shadow(0 10px 15px rgba(255,100,150,.5));
}


/* FINAL ROMANTIC ENVELOPE OPENING */
#envelope {
    transform-style: preserve-3d;
}

#envelopeCurtain {
    display:none !important;
}

.envelope-flap {
    position:absolute;
    inset:0 0 auto 0;
    height:52%;
    transform-origin:top center;
    z-index:5;
    background:transparent;
    clip-path:polygon(0 0,100% 0,50% 100%);
}

.open-flap {
    animation:realFlapOpen 1.6s ease forwards;
}

@keyframes realFlapOpen {
    0% {transform:rotateX(0deg);}
    100% {transform:rotateX(-175deg);}
}

.letter-rise {
    animation:letterRiseReal 1.8s cubic-bezier(.2,1.3,.3,1) forwards;
}

@keyframes letterRiseReal {
    from {
        opacity:0;
        transform:translateY(180px) scale(.85);
    }
    to {
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

#letterContent p {
    opacity:0;
    transform:translateY(20px);
}

.show-text {
    animation:textShow .9s ease forwards;
}

@keyframes textShow {
    to {
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>
<body class="bg-gradient-to-br from-[#08050e] via-[#160c22] to-[#030205] min-h-screen flex flex-col items-center justify-between font-poppins p-3 sm:p-4 relative select-none">

    <canvas id="heartCanvas"></canvas>

    <header class="w-full text-center z-10 mt-5 sm:mt-7 px-2 opacity-0 transition-opacity duration-1000" id="topHeader">
        <h1 class="text-pink-200 text-2xl sm:text-3xl md:text-5xl font-dancing tracking-wider drop-shadow-md">
            I coded this one <span class="text-pink-400">just for you</span> ✨
        </h1>
    </header>

    <main class="relative w-full max-w-lg sm:max-w-xl h-[540px] sm:h-[620px] md:h-[680px] flex items-center justify-center z-20 my-auto">

        <div id="cssCartoon">
            <div class="cartoon-hair"></div>
            <div class="cartoon-head">
                <div class="cartoon-eye left"></div>
                <div class="cartoon-eye right"></div>
                <div class="cartoon-mouth"></div>
            </div>
            <div class="cartoon-body">
                <div class="cartoon-arm left"></div>
                <div class="cartoon-arm right" id="cartoonRightArm"></div>
                <div class="cartoon-leg left"></div>
                <div class="cartoon-leg right"></div>
            </div>
        </div>

        <div id="envelope" class="absolute w-[95%] sm:w-[440px] md:w-[500px] transition-all duration-700 ease-out z-30 opacity-0" style="transform: translateY(30px);">
            <img src="envelope(1).png" alt="Love Envelope" class="w-full h-auto drop-shadow-[0_25px_35px_rgba(0,0,0,0.7)]"><div id="realFlap" class="envelope-flap"></div>
            
            <div id="envelopeCurtain">
                <div class="text-center p-4">
                    <p class="text-pink-100 font-sacramento text-3xl sm:text-4xl drop-shadow-md">For Sadia 💌</p>
                    <p class="text-pink-300 text-[11px] tracking-widest uppercase mt-1">Pulling curtain...</p>
                </div>
            </div>
        </div>

        <div id="letterPaper" class="absolute w-[96%] sm:w-[460px] md:w-[520px] h-[520px] sm:h-[590px] md:h-[640px] bg-[#fffaf5] rounded-2xl shadow-[0_30px_70px_rgba(0,0,0,0.8)] p-6 sm:p-8 opacity-0 scale-75 z-20 flex flex-col justify-between border-2 border-pink-300/60 pointer-events-none transition-all duration-500" style="background-image: url('paper.png'); background-size: cover; background-position: center;">
            
            <div class="flex items-center justify-between border-b-2 border-rose-200/90 pb-3 shrink-0">
                <div class="flex items-center gap-3.5">
                    <div class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-full overflow-hidden border-2 border-rose-500 shadow-lg shrink-0">
                        <img src="Sadia.png" alt="Sadia" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h2 class="text-xl sm:text-3xl font-sacramento text-rose-950 font-bold tracking-wide">Dear Sadia, 💌</h2>
                        <p class="text-[10px] sm:text-xs text-rose-700 uppercase tracking-widest font-semibold">My Heartbeat ✨</p>
                    </div>
                </div>
                <img src="heart.png" class="w-7 h-7 animate-pulse" alt="heart">
            </div>

            <div id="letterContent" class="space-y-4 sm:space-y-5">
                <div class="text-[#2b1820] font-medium leading-relaxed space-y-4 sm:space-y-5 text-base sm:text-lg md:text-xl font-poppins">
                    <p class="font-semibold text-rose-950 text-lg sm:text-xl" id="line1"></p>
                    <p id="line2"></p>
                    <p id="line3"></p>
                    <p id="line4"></p>
                </div>
            </div>

            <div class="pt-4 border-t-2 border-rose-200/90 shrink-0 flex justify-between items-end opacity-0 transition-opacity duration-700" id="letterFooter">
                <div>
                    <span class="text-[10px] sm:text-xs text-rose-800 uppercase tracking-widest font-bold block">Forever yours</span>
                    <p class="text-3xl sm:text-4xl font-dancing text-rose-950 font-bold tracking-wider">NAFI</p>
                </div>
                <img src="heart.png" class="w-7 h-7 opacity-90 animate-bounce" alt="Small Heart">
            </div>
        </div>

    </main>

    <footer class="w-full text-center z-10 mb-3 text-pink-300/40 text-[10px] sm:text-xs tracking-widest"> HANDCODED WITH LOVE BY NAFI © 2026 </footer>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { document.getElementById('topHeader').style.opacity = '1'; }, 300);

            const cartoon = document.getElementById('cssCartoon');
            const rightArm = document.getElementById('cartoonRightArm');
            const envelope = document.getElementById('envelope');
            const curtain = document.getElementById('envelopeCurtain');

            // Step 1: Cartoon walks from Top-Left to envelope center
            cartoon.style.animation = 'walkFromTopLeft 2s cubic-bezier(0.25, 1, 0.5, 1) forwards';

            // Step 2: Reaches envelope, raises arm and pulls curtain away
            setTimeout(() => {
                envelope.style.opacity = '1';
                envelope.classList.add('animate-float');

                // Hand pulls curtain up
                rightArm.classList.add('pulling-arm');

                setTimeout(() => {
                    curtain.classList.add('curtain-pulled'); // Curtain flies off
                    rightArm.classList.remove('pulling-arm'); // Lower arm

                    // Step 3: Cartoon walks away to the Right side
                    setTimeout(() => {
                        cartoon.style.animation = 'walkToRight 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards';

                        setTimeout(() => {
                            cartoon.style.display = 'none';
                            autoOpenLetter(); // Letter opens up smoothly
                        }, 1300);

                    }, 1000);
                }, 1000);

            }, 2100);
        });

        const text1 = "Assalamualaikum jaan,";
        const text2 = "When you came into my life, everything changed so beautifully. You are the sweetest melody my heart hums from dawn till dusk, and the most peaceful calm in all my chaos.";
        const text3 = "Every single moment spent with you feels like a magical dream I never want to wake up from. In your eyes, I found my true home, my happiness, and a love that feels destined.";
        const text4 = "No matter where time leads us, my heart will always choose you, protect you, and cherish you. Thank you for being my forever and always.";

        function typeWriter(text, elementId, speed, callback) {
            let i = 0;
            const element = document.getElementById(elementId);
            const contentBox = document.getElementById('letterContent');
            element.innerHTML = "";
            function typing() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    contentBox.scrollTop = contentBox.scrollHeight;
                    setTimeout(typing, speed);
                } else if (callback) {
                    callback();
                }
            }
            typing();
        }

        function autoOpenLetter() {
    const letter = document.getElementById('letterPaper');
    const envelope = document.getElementById('envelope');

    letter.style.opacity = "1";
    letter.classList.add("letter-rise");

    setTimeout(()=>{
        document.querySelectorAll("#letterContent p").forEach((p,i)=>{
            setTimeout(()=>p.classList.add("show-text"), i*1200);
        });
    },1200);
}
        }

        // --- Heart Rain Canvas ---
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();

        let particles = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.z = Math.random() * 1.2 + 0.5;
                this.size = Math.random() * 14 + 6;
                this.vy = (Math.random() * 2.2 + 1.2) * this.z;
                this.vx = (Math.random() * 1.8 - 0.9) * this.z;
                this.alpha = Math.random() * 0.6 + 0.3;
                this.color = `rgba(255, ${Math.random()*120+100}, ${Math.random()*180+100}, ${this.alpha})`;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                const topCurveHeight = this.size * 0.5;
                ctx.moveTo(this.x, this.y + topCurveHeight);
                ctx.bezierCurveTo(this.x, this.y, this.x - this.size / 2, this.y, this.x - this.size / 2, this.y + topCurveHeight);
                ctx.bezierCurveTo(this.x - this.size / 2, this.y + (this.size + topCurveHeight) / 2, this.x, this.y + this.size, this.x, this.y + this.size);
                ctx.bezierCurveTo(this.x, this.y + this.size, this.x + this.size / 2, this.y + (this.size + topCurveHeight) / 2, this.x + this.size / 2, this.y + topCurveHeight);
                ctx.bezierCurveTo(this.x + this.size / 2, this.y, this.x, this.y, this.x, this.y + topCurveHeight);
                ctx.closePath();
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.y += this.vy;
                this.x += this.vx;
                if (this.y > canvas.height) {
                    this.y = -this.size;
                    this.x = Math.random() * canvas.width;
                }
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 45; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', resizeCanvas);
        initParticles();
        animateParticles();
    

// === REELS STYLE EFFECTS ===
function createSparkles(){
    const container=document.querySelector("main");
    for(let i=0;i<25;i++){
        const s=document.createElement("div");
        s.className="spark";
        s.style.left=Math.random()*100+"%";
        s.style.top=(50+Math.random()*40)+"%";
        s.style.animationDelay=(Math.random()*2)+"s";
        container.appendChild(s);
    }
}
createSparkles();

const oldAutoOpenLetter = autoOpenLetter;
autoOpenLetter = function(){
    oldAutoOpenLetter();
    setTimeout(()=>{
        const letter=document.getElementById("letterPaper");
        letter.classList.add("letter-zoom");
    },700);
};



// ===== Smooth Letter Reveal =====
function premiumLetterAnimation(){
    const letter=document.getElementById("letterPaper");
    letter.classList.add("envelope-open-effect");
    letter.classList.add("floating-letter");

    const paragraphs=document.querySelectorAll("#letterContent p");
    paragraphs.forEach((p)=>{
        p.style.display="block";
    });
}

setTimeout(()=>{
    premiumLetterAnimation();
},5200);

</script>
</body>
</html>
